name: asdf
channels:
  # note: packages _must_ be installed from conda-forge. defaults has a newer/incompatible version of libgsl.
  - conda-forge
dependencies:
  - python=3.11
  - astropy
  - boto3
  - dustgoggles
  - fire
  - git
  - google-api-python-client
  - gspread
# if you are on OSX, comment out the next line because there is no matching conda package
# mosaicking will not be available to you
  - hugin
  - ipython
  - jupyter
  - marslab
  - matplotlib
  - oauth2client
  - opencv
  - pdr
  - pip
  - python-isal
  - pyarrow
  - pytest
  - rich
  - scikit-image
  - sh
  - pip:
      - git+https://github.com/MillionConcepts/pretty-plot.git
      - git+https://github.com/MillionConcepts/silencio.git
